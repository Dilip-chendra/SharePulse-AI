<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="f-tile" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0D1224"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
    <linearGradient id="f-wave" x1="6" y1="24" x2="42" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="55%"  stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="f-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded-square dark tile -->
  <rect x="2" y="2" width="44" height="44" rx="11"
        fill="url(#f-tile)"
        stroke="rgba(99,102,241,0.25)" stroke-width="1.2"/>

  <!-- Pulse waveform -->
  <path d="M6 28 L14 28 C15.5 28 16 29 17 33 C18 37 18.5 37 19 34 L22 13 C22.5 10.5 23 9.5 24 9.5 C25 9.5 25.5 10.5 26 13 L28.5 34 C29 37 29.5 37 30.5 33 C31.5 29 32 28 33 28 L42 28"
        stroke="url(#f-wave)"
        stroke-width="2.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Glowing apex node -->
  <circle cx="24" cy="9.5" r="2.8" fill="#22D3EE" filter="url(#f-glow)"/>
  <circle cx="24" cy="9.5" r="1.4" fill="#FFFFFF"/>
</svg>
